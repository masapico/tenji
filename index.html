<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>点字 - Tenji | 点字学習・変換ツール</title>
    <link rel="icon" type="image/svg+xml" href="./tenji.svg" />
    <meta
      name="description"
      content="点字（凸面）の学習および点字とひらがなの相互変換ができるWebアプリケーションです。ビルド不要で動作し、アクセシビリティに配慮しています。"
    />

    <!-- スタイルシート (デジタル庁デザインシステム + 点字スタイル) -->
    <link rel="stylesheet" href="./css/dads.css" />
    <link rel="stylesheet" href="./css/tenji.css" />
  </head>
  <body>
    <!-- ヘッダー -->
    <header class="dads-header no-print">
      <div class="dads-container dads-header__inner">
        <a href="./" class="dads-header__logo" aria-label="点字 - Tenji ホーム">
          <img src="./tenji.svg" alt="" width="28" height="28" aria-hidden="true" />
          <span>点字 - Tenji</span>
        </a>
        <div class="dads-header__meta">
          <a
            href="https://github.com/masapico/tenji"
            target="_blank"
            rel="noopener noreferrer"
            class="dads-header__github"
            aria-label="GitHubリポジトリを開く（新しいウィンドウで開きます）"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 16 16"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
              ></path>
            </svg>
            <span>GitHub</span>
          </a>
        </div>
      </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="dads-container" id="main-content">
      <!-- モード切り替えタブ (ARIA対応) -->
      <nav class="dads-tabs no-print" aria-label="変換モードの選択">
        <ul class="dads-tab-list" role="tablist">
          <li role="presentation">
            <button
              type="button"
              id="tab-tenji"
              class="dads-tab-button"
              role="tab"
              aria-selected="true"
              aria-controls="panel-tenji"
            >
              点字 → ひらがな
            </button>
          </li>
          <li role="presentation">
            <button
              type="button"
              id="tab-kana"
              class="dads-tab-button"
              role="tab"
              aria-selected="false"
              aria-controls="panel-kana"
            >
              ひらがな → 点字
            </button>
          </li>
        </ul>
      </nav>

      <!-- タブパネル 1: 点字入力モード (ModeTenji) -->
      <section
        id="panel-tenji"
        class="dads-tab-panel is-active"
        role="tabpanel"
        aria-labelledby="tab-tenji"
      >
        <div class="dads-card no-print">
          <p style="margin: 0; font-size: var(--dads-font-size-sm); color: var(--dads-color-text-secondary);">
            <strong>使い方:</strong> 各点字マスのドット（凸面）をクリックまたはキーボード（Tab / Space）で選択すると、リアルタイムで下にひらがなが表示されます。濁点や拗音は前置マスとの2マスで自動認識されます。
          </p>
        </div>

        <!-- 点字行の描画領域 -->
        <div id="tenji-rows-container" class="tenji-rows-container">
          <!-- app.js により動的に描画されます -->
        </div>

        <!-- 行追加ボタン -->
        <div class="no-print" style="margin-top: var(--dads-space-6);">
          <button
            type="button"
            id="btn-add-row"
            class="dads-button dads-button--secondary"
          >
            ＋ 行を追加する
          </button>
        </div>
      </section>

      <!-- タブパネル 2: ひらがな入力モード (ModeKana) -->
      <section
        id="panel-kana"
        class="dads-tab-panel"
        role="tabpanel"
        aria-labelledby="tab-kana"
      >
        <div class="dads-card no-print">
          <div class="dads-form-group">
            <label for="kana-input" class="dads-label">ひらがなを入力</label>
            <span class="dads-helper-text" id="kana-input-helper">
              点字（凸面）に変換したいひらがなを入力してください（例: こんにちは、がっこう、きょう）
            </span>
            <div class="dads-input-group" style="margin-top: var(--dads-space-2);">
              <input
                type="text"
                id="kana-input"
                class="dads-input-text"
                placeholder="文字を入力..."
                autocomplete="off"
                aria-describedby="kana-input-helper"
              />
              <button
                type="button"
                id="btn-kana-translate"
                class="dads-button dads-button--primary"
              >
                点字に変換
              </button>
            </div>
          </div>
        </div>

        <!-- 変換結果の点字マス表示領域 -->
        <div
          id="kana-output-container"
          class="tenji-kana-output"
          role="region"
          aria-live="polite"
          aria-label="点字変換結果"
        >
          <div class="tenji-kana-empty-hint">
            上の入力欄にひらがなを入力すると、ここに点字が表示されます。
          </div>
        </div>
      </section>
    </main>

    <!-- フッター -->
    <footer class="dads-footer no-print">
      <div class="dads-container">
        <p style="margin: 0 0 var(--dads-space-2);">
          点字データは <a href="./tenjimap.json">tenjimap.json</a>（CC BY 4.0）に基づき公開されています。
        </p>
        <p style="margin: 0; font-size: var(--dads-font-size-xs);">
          デザインシステム: <a href="https://design.digital.go.jp/" target="_blank" rel="noopener noreferrer">デジタル庁デザインシステム (DADS)</a> に準拠
        </p>
      </div>
    </footer>

    <!-- アプリケーションスクリプト (ビルド不要・ES Modules) -->
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
